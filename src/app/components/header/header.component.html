<header>
  <nav class="menu">
    <div class="logo">
      <img src="/logo.png" />
    </div>

    <div class="links">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a routerLinkActive="active" routerLink="/sobre">Sobre</a>
      <a routerLinkActive="active" routerLink="/contato">Contato</a>
    </div>

    <div>
      <app-button label="Contato">Contato</app-button>
    </div>
  </nav>

  <nav class="menu-mobile">
    <img src="/logo.png" />
    <button
      mat-icon-button
      [matMenuTriggerFor]="menu"
      aria-label="Example icon-button with a menu"
    >
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" class="mat-menu">
      <button mat-menu-item>
        <mat-icon fontIcon="home"></mat-icon>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          >Home</a
        >
      </button>

      <button mat-menu-item>
        <mat-icon fontIcon="school"></mat-icon>
        <a routerLinkActive="active" routerLink="/sobre">Sobre</a>
      </button>

      <button mat-menu-item>
        <mat-icon fontIcon="phone"></mat-icon>
        <a routerLinkActive="active" routerLink="/contato">Contato</a>
      </button>
    </mat-menu>
  </nav>
</header>
